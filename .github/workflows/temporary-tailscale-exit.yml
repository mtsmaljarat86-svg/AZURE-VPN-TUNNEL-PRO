name: Temporary Tailscale Exit Node (Experimental)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep the temporary connection running (30-300 minutes)"
        required: true
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: temporary-tailscale-exit
  cancel-in-progress: true

jobs:
  temporary-exit-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Validate runner and enable forwarding
        shell: bash
        run: |
          set -euo pipefail
          DURATION="${{ inputs.duration_minutes }}"
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || (( DURATION < 30 || DURATION > 300 )); then
            echo "Choose a duration from 30 to 300 minutes."
            exit 1
          fi
          echo "DURATION_MINUTES=$DURATION" >> "$GITHUB_ENV"

          sudo modprobe tun || true
          test -c /dev/net/tun || { echo "::error::/dev/net/tun is unavailable; this runner cannot be a kernel-mode exit node."; exit 1; }
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          echo "TUN device and IP forwarding are enabled."

      - name: Connect and advertise as a Tailscale exit node
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:github-exit
          version: latest
          args: --advertise-exit-node
          log-mode: normal

      - name: Diagnose exit-node routing and outbound internet
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Tailscale status ==="
          sudo tailscale status
          echo
          echo "=== Tailscale IPv4 ==="
          sudo tailscale ip -4
          echo
          echo "=== Kernel forwarding ==="
          sysctl net.ipv4.ip_forward
          sysctl net.ipv6.conf.all.forwarding
          echo
          echo "=== Interfaces and routes ==="
          ip -brief address
          ip route
          echo
          echo "=== Firewall forwarding rules ==="
          sudo iptables -S FORWARD || true
          sudo iptables -t nat -S POSTROUTING || true
          echo
          echo "=== Runner public IPv4 (expected egress IP if phone traffic is routed through this runner) ==="
          curl --fail --silent --show-error --max-time 15 -4 https://api.ipify.org
          echo
          echo
          echo "Compare the runner public IPv4 above with the IP shown on the iPhone while this exit node is selected."
          echo "If they differ, phone traffic is not using this exit node yet."

      - name: Keep the temporary connection alive
        shell: bash
        run: |
          set -euo pipefail
          echo "The temporary node will stay online for ${DURATION_MINUTES} minutes."
          echo "Keep this workflow running while using the iPhone. Cancelling this run disconnects it."
          sleep "$((DURATION_MINUTES * 60))"

      - name: Finish
        if: always()
        run: echo "Workflow finished. The Tailscale action will log out the temporary node."
