name: Test WireGuard on GitHub Actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wireguard-config-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wireguard-tools

      - name: Generate temporary test keys and validate config
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/wg-test"
          cd "$RUNNER_TEMP/wg-test"

          SERVER_PRIVATE="$(wg genkey)"
          SERVER_PUBLIC="$(printf '%s' "$SERVER_PRIVATE" | wg pubkey)"
          CLIENT_PRIVATE="$(wg genkey)"
          CLIENT_PUBLIC="$(printf '%s' "$CLIENT_PRIVATE" | wg pubkey)"
          PSK="$(wg genpsk)"

          cat > test.conf <<EOF
          [Interface]
          Address = 10.77.0.1/24
          ListenPort = 51820
          PrivateKey = ${SERVER_PRIVATE}

          [Peer]
          PublicKey = ${CLIENT_PUBLIC}
          PresharedKey = ${PSK}
          AllowedIPs = 10.77.0.2/32
          EOF

          # Parse/normalize the configuration without bringing up a VPN interface.
          wg-quick strip "$PWD/test.conf" > stripped.conf
          grep -q 'ListenPort = 51820' stripped.conf
          grep -q 'AllowedIPs = 10.77.0.2/32' stripped.conf
          test -n "$SERVER_PUBLIC"
          test -n "$CLIENT_PRIVATE"
          echo "PASS: WireGuard tools installed; temporary keys generated; config parsed."
          echo "NOTE: This is a syntax/configuration test only, not a reachable VPN server."
